[project]
name = "bms-endorsement-platform"
version = "0.1.0"
description = "BMS Masaood medical insurance endorsement processing platform"
requires-python = ">=3.11"

# The template-preservation core deliberately depends on the standard library
# only. General-purpose spreadsheet libraries rewrite parts they do not
# understand, which is the one thing this application must never do.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Used only to independently verify generated output, never to produce it.
verify = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
