name: Reports

# On-demand only. Nothing here runs on a push -- start it from the Actions tab
# when you want evidence rather than a pass/fail:
#
#   * inventory     -- what the registry believes each workbook looks like
#   * preservation  -- generate from every master and diff the structure
#   * blank-fields  -- prove the log's post-submission columns come out empty
#   * sources       -- SHA-256 of every supplied file against the manifest
#
# The report renders in the run summary. Generated sample workbooks are attached
# as an artifact so they can be opened in Excel and checked by eye.

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to produce"
        type: choice
        default: all
        options:
          - all
          - inventory
          - preservation
          - blank-fields
          - sources
      rows:
        description: "Synthetic member rows per template (preservation report)"
        type: string
        default: "3"
      attach_samples:
        description: "Attach the generated sample workbooks as an artifact"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  report:
    name: ${{ inputs.report }} report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Source integrity report
        if: inputs.report == 'sources' || inputs.report == 'all'
        run: python3 tools/verify_sources.py --out "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Template reports
        if: inputs.report != 'sources'
        run: |
          mkdir -p ../samples
          python3 -m tools.reports "${{ inputs.report }}" \
            --rows "${{ inputs.rows }}" \
            --samples ../samples \
            --out ../report.md
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.report }}
          path: report.md
          if-no-files-found: ignore

      # Sample workbooks contain synthetic values only -- no client or member
      # data is ever generated by this workflow.
      - name: Upload generated sample workbooks
        if: always() && inputs.attach_samples
        uses: actions/upload-artifact@v4
        with:
          name: sample-workbooks
          path: samples/
          if-no-files-found: ignore
          retention-days: 7
